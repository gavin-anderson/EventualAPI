name: Build and deploy

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

  deploy:
    # Production deploy: only on a push to main, after the build passes.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    concurrency: heroku-production
    steps:
      - uses: actions/checkout@v4
        with:
          # Heroku's git endpoint rejects shallow pushes.
          fetch-depth: 0
      - name: Push to Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_PROD_APP: ${{ secrets.HEROKU_PROD_APP }}
        run: |
          git push --force \
            "https://heroku:${HEROKU_API_KEY}@git.heroku.com/${HEROKU_PROD_APP}.git" \
            HEAD:refs/heads/main
